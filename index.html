<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14181f" />
  <meta name="description" content="Editor local de gabinetes y esquemas eléctricos. Componentes, cableado, cotas y planos." />
  <title>ElCAD eléctrico — Diseño de gabinetes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header id="topbarRoot" aria-label="Barra superior"></header>
    <aside id="library" class="side side-left" aria-label="Biblioteca de componentes"></aside>
    <main id="stage" class="stage">
      <canvas id="editorCanvas" tabindex="0" aria-label="Lienzo de diseño eléctrico"></canvas>
      <div id="emptyHint" class="empty-hint">
        <strong>Plano vacío</strong>
        <p>Elegí un componente en la biblioteca (o <kbd>Ctrl K</kbd>), hacé clic en el lienzo para colocarlo y cablealo con <kbd>W</kbd>.</p>
        <div class="empty-actions">
          <button type="button" id="startCatalog" class="btn primary">Buscar componente <kbd>Ctrl K</kbd></button>
          <button type="button" id="startDemo" class="btn">Cargar ejemplo</button>
        </div>
      </div>
    </main>
    <aside id="properties" class="side side-right" aria-label="Propiedades"></aside>
    <div id="statusBar" class="status-bar" role="status" aria-label="Estado del editor"></div>
  </div>
  <div id="paletteRoot"></div>
  <div id="toastRoot" class="toast-root" role="status" aria-live="polite"></div>
  <script type="module" src="src/app/main.js"></script>
</body>
</html>
